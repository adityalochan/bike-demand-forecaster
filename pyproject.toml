[project]
name = "bike-demand-forecaster"
version = "0.1.0"
description = "Hourly bike-rental forecaster with a hand-written PyTorch training loop."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
